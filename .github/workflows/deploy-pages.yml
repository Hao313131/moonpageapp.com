name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the sitemap's <lastmod> dates are read out of git by
          # scripts/gen-content-dates.mjs. The default shallow checkout knows
          # only one commit, and the script would (correctly) emit no dates.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # IndexNow: tell Bing/Yandex/Seznam/Naver the site changed, minutes after
      # deploy instead of waiting for a crawl. Runs post-deploy so it pushes the
      # URLs that are actually live. The key file (public/indexnow-key.txt) ships
      # with the static export, so the engine can verify ownership.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ping IndexNow (Bing / Yandex)
        run: node scripts/indexnow.mjs
        env:
          SITE_DOMAIN: https://moonpageapp.com
