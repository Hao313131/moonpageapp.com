name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the sitemap's <lastmod> dates are read out of git by
          # scripts/gen-content-dates.mjs. The default shallow checkout knows
          # only one commit, and the script would (correctly) emit no dates.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        # next/font/google downloads the webfonts from fonts.gstatic.com at build
        # time, so the build has a hard dependency on Google's CDN. When that
        # fetch fails it surfaces as a Turbopack
        # "Module not found: @vercel/turbopack-next/internal/font/google/font"
        # error and takes the whole deploy down with it — 3 of the last 60 runs
        # died this way. Because a failed run leaves the PREVIOUS build live,
        # the push looked fine while the site silently stayed stale. That is the
        # dangerous part: it is invisible unless you read the run status.
        #
        # The failure is transient (one pair failed at 09:07 and succeeded at
        # 09:12 on identical code), so retry. Two extra minutes beats a silent
        # no-op deploy. The permanent fix is next/font/local with the woff2
        # files vendored into the repo — see docs/你现在要做的.md.
        run: |
          for attempt in 1 2 3; do
            if npm run build; then
              echo "Build succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "::warning::Build attempt ${attempt} of 3 failed — retrying."
            sleep 15
          done
          echo "::error::Build failed on all 3 attempts. The live site is still on the previous build."
          exit 1
        env:
          # Search-engine / webmaster verification tags (layout.tsx reads these).
          # Add the secrets in repo Settings → Secrets once you have each token;
          # an unset value emits NO tag, which is safer than a wrong one.
          NEXT_PUBLIC_GSC_VERIFICATION: ${{ secrets.GSC_VERIFICATION }}
          NEXT_PUBLIC_BING_VERIFICATION: ${{ secrets.BING_VERIFICATION }}
          NEXT_PUBLIC_YANDEX_VERIFICATION: ${{ secrets.YANDEX_VERIFICATION }}
          NEXT_PUBLIC_PINTEREST_VERIFICATION: ${{ secrets.PINTEREST_VERIFICATION }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # IndexNow: tell Bing/Yandex/Seznam/Naver the site changed, minutes after
      # deploy instead of waiting for a crawl. Runs post-deploy so it pushes the
      # URLs that are actually live. The key file (public/indexnow-key.txt) ships
      # with the static export, so the engine can verify ownership.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ping IndexNow (Bing / Yandex)
        run: node scripts/indexnow.mjs
        env:
          SITE_DOMAIN: https://moonpageapp.com
